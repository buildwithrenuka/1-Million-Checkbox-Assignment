<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Responsive layout ke liye viewport meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>1M Checkboxes</title>

  <!-- Google fonts preload (performance optimize karta hai) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Custom fonts load -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    /* Root CSS variables — theme colors define kiye gaye hain */
    :root {
      --bg: #0a0a0f; /* background */
      --surface: #111118; /* cards/panels */
      --text: #e8e8f0; /* primary text */
      --green: #00ff88; /* highlight color */
      --mono: 'DM Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    /* Reset styles — default margin/padding hata rahe hain */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
    }

    /* Layout wrapper — center align + padding */
    .shell {
      max-width: 1200px;
      margin: auto;
      padding: 40px;
    }

    /* Header styling */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Status dot (connection indicator) */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: gray;
    }
    .dot.connected { background: green; }
    .dot.error { background: red; }

    /* Grid container (checkbox layout) */
    #grid {
      display: grid;
      grid-template-columns: repeat(50, 1fr); /* 50 columns */
      gap: 4px;
    }

    /* Individual checkbox cell */
    .cell {
      aspect-ratio: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      border: 1px solid #333;
      cursor: pointer;
    }

    .cell input {
      cursor: pointer;
    }
  </style>
</head>

<body>
<div class="shell">

  <!-- Header section -->
  <header>
    <div>
      <h1>1M Checkboxes</h1>
      <p>Realtime shared board</p>
    </div>

    <!-- Connection status -->
    <div>
      <span id="statusDot" class="dot"></span>
      <span id="statusText">disconnected</span>
    </div>
  </header>

  <!-- Checkbox grid -->
  <div id="viewport">
    <div id="spacer"></div> <!-- scrollbar height control -->
    <div id="grid"></div>   <!-- visible cells -->
  </div>

</div>

<script>
  // ─────────────────────────────────────────────
  // API + WebSocket base URLs
  // same origin se automatically pick ho jayega
  // ─────────────────────────────────────────────
  const API_BASE = window.location.origin;
  const WS_BASE  = API_BASE.replace(/^http/, "ws");

  // ─────────────────────────────────────────────
  // Constants
  // ─────────────────────────────────────────────
  const TOTAL = 1_000_000; // total checkboxes
  const COLS  = 50;        // columns per row

  // ─────────────────────────────────────────────
  // Bit state (memory efficient storage)
  // 1M booleans ko bit array me store kar rahe hain
  // ─────────────────────────────────────────────
  const bitState = new Uint8Array(Math.ceil(TOTAL / 8));

  // Bit read helper
  function getBit(i) {
    return (bitState[i >> 3] >> (i & 7)) & 1;
  }

  // Bit write helper
  function setBit(i, val) {
    if (val) bitState[i >> 3] |= (1 << (i & 7));
    else     bitState[i >> 3] &= ~(1 << (i & 7));
  }

  // ─────────────────────────────────────────────
  // DOM references
  // ─────────────────────────────────────────────
  const grid       = document.getElementById("grid");
  const viewport   = document.getElementById("viewport");
  const spacer     = document.getElementById("spacer");
  const statusText = document.getElementById("statusText");
  const statusDot  = document.getElementById("statusDot");

  let ws; // WebSocket instance

  // ─────────────────────────────────────────────
  // Status update helper
  // ─────────────────────────────────────────────
  function setStatus(text, state="") {
    statusText.textContent = text;
    statusDot.className = "dot " + state;
  }

  // ─────────────────────────────────────────────
  // Virtual scrolling setup
  // full 1M render nahi karte (performance ke liye)
  // sirf visible portion render hota hai
  // ─────────────────────────────────────────────
  const ROW_H = 22;
  const totalRows = Math.ceil(TOTAL / COLS);

  spacer.style.height = (totalRows * ROW_H) + "px";

  // ─────────────────────────────────────────────
  // Render visible window
  // ─────────────────────────────────────────────
  function renderWindow() {
    const scrollTop = viewport.scrollTop;
    const viewH     = viewport.clientHeight;

    const firstRow = Math.floor(scrollTop / ROW_H);
    const lastRow  = Math.ceil((scrollTop + viewH) / ROW_H);

    const startIdx = firstRow * COLS;
    const endIdx   = Math.min(TOTAL, lastRow * COLS);

    grid.innerHTML = ""; // reset

    for (let i = startIdx; i < endIdx; i++) {
      const label = document.createElement("label");
      label.className = "cell";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = getBit(i);

      // click event → server ko send karega
      cb.onclick = () => {
        if (!ws || ws.readyState !== 1) {
          alert("Login karo pehle");
          return;
        }
        ws.send(JSON.stringify({ index: i }));
      };

      label.appendChild(cb);
      grid.appendChild(label);
    }

    // grid ko correct vertical position pe shift
    grid.style.transform = `translateY(${firstRow * ROW_H}px)`;
  }

  // scroll event → re-render
  viewport.addEventListener("scroll", renderWindow);

  // ─────────────────────────────────────────────
  // WebSocket connection
  // ─────────────────────────────────────────────
  function connectWS(token) {
    ws = new WebSocket(`${WS_BASE}?token=${token}`);

    ws.onopen = () => {
      setStatus("connected", "connected");
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      // Server se update aaya → local state update
      if (data.type === "UPDATE") {
        setBit(data.index, data.value ? 1 : 0);

        // Agar visible hai → UI update
        const cb = document.getElementById("cb-" + data.index);
        if (cb) cb.checked = data.value;
      }
    };

    ws.onclose = () => {
      setStatus("disconnected");
    };

    ws.onerror = () => {
      setStatus("error", "error");
    };
  }

  // ─────────────────────────────────────────────
  // Initial state load
  // ─────────────────────────────────────────────
  async function loadState() {
    try {
      const res  = await fetch(`${API_BASE}/state`);
      const bits = await res.json();

      // Server state ko local bit array me pack kar rahe hain
      for (let i = 0; i < bits.length; i++) {
        setBit(i, bits[i] ? 1 : 0);
      }

      renderWindow(); // render after load
    } catch {
      alert("State load failed");
    }
  }

  // ─────────────────────────────────────────────
  // Boot sequence
  // ─────────────────────────────────────────────
  renderWindow(); // initial empty render
  loadState();    // then actual data load

  // NOTE: token agar hai toh connectWS(token) call karna hoga
</script>

</body>
</html>
